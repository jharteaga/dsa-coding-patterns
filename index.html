<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSA Patterns</title>
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <script>
      // GoatCounter: the app uses HashRouter, so count each route change manually.
      window.goatcounter = { no_onload: true };
      function gcCount() {
        if (window.goatcounter && window.goatcounter.count)
          window.goatcounter.count({ path: location.pathname + (location.hash.slice(1) || '/') });
      }
      window.addEventListener('hashchange', gcCount);
      window.addEventListener('load', gcCount);
    </script>
    <script data-goatcounter="https://jarteagag.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
